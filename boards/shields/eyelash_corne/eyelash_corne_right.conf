#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# === Basic ===
CONFIG_INPUT=y

# === Battery (Peripheral) ===
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Split link latency ===
# ZMK's app/Kconfig defaults BT_PERIPHERAL_PREF_LATENCY=30 with a 7.5-15ms
# interval, so this half is allowed to skip up to 30 connection events before it
# has an anchor point to send a key event on -- hundreds of ms in the worst case.
# Left-half keys go straight out over the host link, so a right-half key pressed
# first can arrive at the computer after a left-half key pressed later.
# 0 latency, interval pinned to 7.5ms. Costs peripheral battery; that's the trade.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6