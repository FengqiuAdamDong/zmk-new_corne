---
# TEMPORARY: OLEDs disabled to test whether the displays are behind the
# split-half key ordering issue. To restore, put ` eyelash_corne_oled` back on
# each shield line and re-add `-DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y`
# to the cmake-args, plus the two *_oled_builtin fallback entries.
#
# Dropping the shield is what turns the screens off: CONFIG_ZMK_DISPLAY=y lives
# in boards/shields/eyelash_corne_oled/eyelash_corne_oled.conf, which is only
# applied when that shield is in the list. The base eyelash_corne shield has no
# display dependency of its own.
#
# NOTE: the whole of this file becomes the GitHub Actions build matrix, so
# "include" must stay the only top-level key (no YAML anchors).
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right
    artifact-name: eyelash_corne_right
  - board: nice_nano_v2
    shield: eyelash_corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
