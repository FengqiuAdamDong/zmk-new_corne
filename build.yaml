---
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
  # --- display debugging: remove these once the screen is fixed ---
  # Test build for an I2C SSD1306 OLED instead of a nice!view.
  - board: nice_nano_v2
    shield: eyelash_corne_left eyelash_corne_oled
    artifact-name: eyelash_corne_left_oled
  - board: nice_nano_v2
    shield: eyelash_corne_right eyelash_corne_oled
    artifact-name: eyelash_corne_right_oled
  # nice!view builds with USB logging, to see why the SPI display stays dark.
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: eyelash_corne_left_logging
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: eyelash_corne_right_logging